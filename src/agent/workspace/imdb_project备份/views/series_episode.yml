# 电视剧系列-剧集层级视图
# 展示电视剧系列及其所有剧集的层级关系
name: series_episode
description: "电视剧系列及其剧集信息视图，展示系列-季-集的层级关系"

model: titles

joins:
  - name: episodes
    sql: "titles.id = episodes.parent_id"
  - name: episode_titles
    sql: "episodes.id = episode_titles.id"
    model: titles

dimensions:
  - name: series_id
    sql: "titles.id"
    type: string
  - name: series_title
    sql: "titles.primary_title"
    type: string
  - name: series_start_year
    sql: "titles.start_year"
    type: int
  - name: series_end_year
    sql: "titles.end_year"
    type: int
  - name: episode_id
    sql: "episode_titles.id"
    type: string
  - name: episode_title
    sql: "episode_titles.primary_title"
    type: string
  - name: season_number
    sql: "episodes.season_number"
    type: int
  - name: episode_number
    sql: "episodes.episode_number"
    type: int
  - name: episode_year
    sql: "episode_titles.start_year"
    type: int
  - name: episode_rating
    sql: "episode_titles.average_rating"
    type: double
  - name: episode_runtime
    sql: "episode_titles.runtime_minutes"
    type: int

filters:
  - sql: "titles.title_type = 'tvSeries'"
