# IMDb 完整关系定义
# 包含：数据库外键 + 命名约定推断 + 手动补充的核心业务关系
# 注意：WrenAI 的 relationship 是双向的，MANY_TO_ONE 表示 source 多对一 target
relationships:

# ── 核心关系：作品 ↔ 参与者 ↔ 人物 ──

- name: principals_titles
  models:
  - principals
  - titles
  join_type: MANY_TO_ONE
  condition: principals.title_id = titles.id
  description: "参与者 → 作品：每个参与者记录关联一部作品"

- name: principals_names
  models:
  - principals
  - names
  join_type: MANY_TO_ONE
  condition: principals.name_id = names.id
  description: "参与者 → 人物：每个参与者记录关联一个人物"

- name: principals_categories
  models:
  - principals
  - categories
  join_type: MANY_TO_ONE
  condition: principals.category_id = categories.code
  description: "参与者 → 职位类别：每个参与者有一个职位类别（actor/director等）"

- name: principals_jobs
  models:
  - principals
  - jobs
  join_type: MANY_TO_ONE
  condition: principals.job_id = jobs.code
  description: "参与者 → 具体职位：每个参与者可有一个细化职位描述"

# ── 作品 ↔ 类型 ──

- name: titles_genres_titles
  models:
  - titles_genres
  - titles
  join_type: MANY_TO_ONE
  condition: titles_genres.title_id = titles.id
  description: "作品-类型关联 → 作品"

- name: titles_genres_genres
  models:
  - titles_genres
  - genres
  join_type: MANY_TO_ONE
  condition: titles_genres.genre_id = genres.id
  description: "作品-类型关联 → 类型"

# ── 人物 ↔ 职业/代表作 ──

- name: names_knownfortitles_names
  models:
  - names_knownfortitles
  - names
  join_type: MANY_TO_ONE
  condition: names_knownfortitles.name_id = names.id

- name: names_knownfortitles_titles
  models:
  - names_knownfortitles
  - titles
  join_type: MANY_TO_ONE
  condition: names_knownfortitles.title_id = titles.id
  description: "人物代表作 → 作品"

- name: names_primaryprofessions_names
  models:
  - names_primaryprofessions
  - names
  join_type: MANY_TO_ONE
  condition: names_primaryprofessions.name_id = names.id

- name: names_primaryprofessions_professions
  models:
  - names_primaryprofessions
  - professions
  join_type: MANY_TO_ONE
  condition: names_primaryprofessions.profession_id = professions.id
  description: "人物-职业关联 → 职业"

# ── 剧集层级 ──

- name: episodes_titles_parent
  models:
  - episodes
  - titles
  join_type: MANY_TO_ONE
  condition: episodes.parent_id = titles.id
  description: "剧集 → 父系列：episodes.parent_id = titles.id（系列）"

- name: episodes_titles_episode
  models:
  - episodes
  - titles
  join_type: MANY_TO_ONE
  condition: episodes.id = titles.id
  description: "剧集 → 自身标题：episodes.id = titles.id（剧集）"

# ── 参与者 ↔ 角色 ──

- name: principals_characters_principals
  models:
  - principals_characters
  - principals
  join_type: MANY_TO_ONE
  condition: principals_characters.principal_id = principals.id

# ── 别名 ──

- name: titleakas_titles
  models:
  - titleakas
  - titles
  join_type: MANY_TO_ONE
  condition: titleakas.title_id = titles.id
  description: "别名 → 作品"

- name: titleakas_titleakaattributes
  models:
  - titleakas
  - titleakaattributes
  join_type: MANY_TO_ONE
  condition: titleakas.title_id = titleakaattributes.id

- name: titleakas_titleakaattributes_titleakaattributes
  models:
  - titleakas_titleakaattributes
  - titleakaattributes
  join_type: MANY_TO_ONE
  condition: titleakas_titleakaattributes.titleaka_id = titleakaattributes.id

- name: titleakas_titleakatypes_titleakaattributes
  models:
  - titleakas_titleakatypes
  - titleakaattributes
  join_type: MANY_TO_ONE
  condition: titleakas_titleakatypes.titleaka_id = titleakaattributes.id
