<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
<script>
// CDN 兜底：主源加载失败时回退到备用源
if (typeof echarts === 'undefined') {
  document.write('<script src="https://unpkg.com/echarts@6.0.0/dist/echarts.min.js"><\/script>');
}
</script>
</head>
<body style="margin:0;padding:0;background:#fff;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
<div id="chart" style="width:100vw;height:100vh;"></div>
<script>
(function() {
  var option = {
  "backgroundColor": "#fff",
  "title": {
    "text": "评分最高的电视剧系列 Top 10",
    "left": "center",
    "top": "2%"
  },
  "tooltip": {
    "trigger": "axis",
    "axisPointer": {
      "type": "shadow"
    }
  },
  "legend": {
    "data": [
      "评分"
    ],
    "top": "8%"
  },
  "grid": {
    "left": 320,
    "right": 40,
    "top": 60,
    "bottom": 50
  },
  "xAxis": {
    "type": "value",
    "name": "评分",
    "min": 8.5,
    "max": 9.6
  },
  "yAxis": {
    "type": "category",
    "data": [
      "Aspirants",
      "The Filthy Frank Show",
      "Koombiyo",
      "The Legend of Hanuman",
      "Fullmetal Alchemist: Brotherhood",
      "Our Planet",
      "BB Ki Vines",
      "Sapne Vs Everyone",
      "Bluey",
      "Steel Ball Run: JoJo's Bizarre Adventure"
    ]
  },
  "series": [
    {
      "name": "评分",
      "type": "bar",
      "data": [
        9.1,
        9.1,
        9.1,
        9.1,
        9.1,
        9.2,
        9.2,
        9.2,
        9.3,
        9.5
      ],
      "label": {
        "show": true,
        "position": "right",
        "formatter": "{c}"
      },
      "itemStyle": {
        "color": "#5470c6"
      },
      "barWidth": 20
    }
  ]
};
  var chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
  chart.setOption(option);
  window.addEventListener('resize', function(){ chart.resize(); });
})();
</script>
</body>
</html>
