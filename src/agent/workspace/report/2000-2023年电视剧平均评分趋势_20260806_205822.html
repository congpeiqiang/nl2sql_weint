<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
<script>
// CDN 兜底：主源加载失败时回退到备用源
if (typeof echarts === 'undefined') {
  document.write('<script src="https://unpkg.com/echarts@6.0.0/dist/echarts.min.js"><\/script>');
}
</script>
</head>
<body style="margin:0;padding:0;background:#fff;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
<div id="chart" style="width:100vw;height:100vh;"></div>
<script>
(function() {
  var option = {
  "backgroundColor": "#fff",
  "title": {
    "text": "2000-2023年电视剧平均评分趋势",
    "left": "center",
    "top": "2%"
  },
  "tooltip": {
    "trigger": "axis"
  },
  "legend": {
    "data": [
      "平均评分"
    ]
  },
  "grid": {
    "left": 60,
    "right": 40,
    "top": 60,
    "bottom": 50
  },
  "xAxis": {
    "type": "category",
    "name": "年份",
    "data": [
      "2000",
      "2001",
      "2002",
      "2003",
      "2004",
      "2005",
      "2006",
      "2007",
      "2008",
      "2009",
      "2010",
      "2011",
      "2012",
      "2013",
      "2014",
      "2015",
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023"
    ]
  },
  "yAxis": {
    "type": "value",
    "name": "平均评分",
    "min": 6,
    "max": 7
  },
  "series": [
    {
      "name": "平均评分",
      "type": "line",
      "data": [
        6.59,
        6.36,
        6.47,
        6.46,
        6.37,
        6.37,
        6.5,
        6.45,
        6.55,
        6.64,
        6.76,
        6.77,
        6.81,
        6.77,
        6.83,
        6.84,
        6.84,
        6.85,
        6.83,
        6.86,
        6.82,
        6.72,
        6.82,
        6.83
      ],
      "smooth": true,
      "itemStyle": {
        "color": "#5470c6"
      },
      "lineStyle": {
        "width": 3
      },
      "areaStyle": {
        "opacity": 0.15
      },
      "label": {
        "show": true,
        "position": "top",
        "formatter": "{c}",
        "fontSize": 10
      }
    }
  ]
};
  var chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
  chart.setOption(option);
  window.addEventListener('resize', function(){ chart.resize(); });
})();
</script>
</body>
</html>
