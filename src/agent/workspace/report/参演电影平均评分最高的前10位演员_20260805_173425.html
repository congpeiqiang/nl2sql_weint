<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
<script>
// CDN 兜底：主源加载失败时回退到备用源
if (typeof echarts === 'undefined') {
  document.write('<script src="https://unpkg.com/echarts@6.0.0/dist/echarts.min.js"><\/script>');
}
</script>
</head>
<body style="margin:0;padding:0;background:#fff;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
<div id="chart" style="width:100vw;height:100vh;"></div>
<script>
(function() {
  var option = {
  "backgroundColor": "#fff",
  "title": {
    "text": "参演电影平均评分最高的前10位演员",
    "left": "center",
    "top": "2%"
  },
  "tooltip": {
    "trigger": "axis",
    "axisPointer": {
      "type": "shadow"
    }
  },
  "legend": {
    "data": [
      "平均评分"
    ],
    "top": "10%"
  },
  "grid": {
    "left": 200,
    "right": 50,
    "top": "18%",
    "bottom": 50
  },
  "xAxis": {
    "type": "value",
    "name": "平均评分",
    "min": 7
  },
  "yAxis": {
    "type": "category",
    "data": [
      "Christopher Plummer",
      "John Carroll Lynch",
      "Marisa Tomei",
      "Hugh Jackman",
      "Timothée Chalamet",
      "Marion Cotillard",
      "Domhnall Gleeson",
      "Mark Ruffalo",
      "Zendaya",
      "Leonardo DiCaprio"
    ]
  },
  "series": [
    {
      "name": "平均评分",
      "type": "bar",
      "data": [
        7.38,
        7.4,
        7.42,
        7.44,
        7.5,
        7.56,
        7.57,
        7.6,
        7.73,
        7.76
      ],
      "label": {
        "show": true,
        "position": "right"
      },
      "itemStyle": {
        "color": "#5470c6"
      },
      "barWidth": 20
    }
  ]
};
  var chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
  chart.setOption(option);
  window.addEventListener('resize', function(){ chart.resize(); });
})();
</script>
</body>
</html>
