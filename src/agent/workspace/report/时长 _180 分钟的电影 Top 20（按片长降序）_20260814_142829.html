<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
<script>
// CDN 兜底：主源加载失败时回退到备用源
if (typeof echarts === 'undefined') {
  document.write('<script src="https://unpkg.com/echarts@6.0.0/dist/echarts.min.js"><\/script>');
}
</script>
</head>
<body style="margin:0;padding:0;background:#fff;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
<div id="chart" style="width:100vw;height:100vh;"></div>
<script>
(function() {
  var option = {
  "backgroundColor": "#fff",
  "title": {
    "text": "时长 >180 分钟的电影 Top 20（按片长降序）",
    "left": "center",
    "top": "2%",
    "textStyle": {
      "fontSize": 16
    }
  },
  "tooltip": {
    "trigger": "axis",
    "axisPointer": {
      "type": "shadow"
    }
  },
  "grid": {
    "left": 280,
    "right": 80,
    "top": 50,
    "bottom": 40
  },
  "xAxis": {
    "type": "value",
    "name": "片长（分钟）"
  },
  "yAxis": {
    "type": "category",
    "data": [
      "The Wake",
      "Empired",
      "Psychos DFLLL",
      "Tendrils",
      "La Flor",
      "Appalachian Jetsam",
      "Tom and Jerry Golden Era",
      "Crude Oil",
      "Saving Julian",
      "exergue - on documenta 14",
      "My Reflected Death",
      "NY Yankees Collector's Ed",
      "Kahrlton Heights North",
      "16 Hours of MILFS 3",
      "His Last Stand",
      "Behind the Royal Curtain",
      "Bullfighting Memories",
      "Breaking Yop",
      "Sakhi",
      "Pakistan: Education & Women"
    ],
    "axisLabel": {
      "fontSize": 10
    }
  },
  "series": [
    {
      "name": "片长(分钟)",
      "type": "bar",
      "data": [
        777,
        780,
        780,
        799,
        808,
        815,
        817,
        840,
        840,
        840,
        842,
        865,
        900,
        960,
        990,
        1100,
        1100,
        1151,
        1179,
        1184
      ],
      "itemStyle": {
        "color": {
          "type": "linear",
          "x": 0,
          "y": 0,
          "x2": 1,
          "y2": 0,
          "colorStops": [
            {
              "offset": 0,
              "color": "#ee6666"
            },
            {
              "offset": 1,
              "color": "#fac858"
            }
          ]
        }
      },
      "label": {
        "show": true,
        "position": "right",
        "fontSize": 10
      }
    }
  ]
};
  var chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
  chart.setOption(option);
  window.addEventListener('resize', function(){ chart.resize(); });
})();
</script>
</body>
</html>
