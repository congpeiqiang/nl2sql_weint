<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
<script>
// CDN 兜底：主源加载失败时回退到备用源
if (typeof echarts === 'undefined') {
  document.write('<script src="https://unpkg.com/echarts@6.0.0/dist/echarts.min.js"><\/script>');
}
</script>
</head>
<body style="margin:0;padding:0;background:#fff;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
<div id="chart" style="width:100vw;height:100vh;"></div>
<script>
(function() {
  var option = {
  "backgroundColor": "#fff",
  "title": {
    "text": "各类型电影数量分布",
    "left": "center",
    "top": "2%"
  },
  "tooltip": {
    "trigger": "axis",
    "formatter": "{b}: {c} 部"
  },
  "grid": {
    "left": 150,
    "right": 30,
    "top": 60,
    "bottom": 30
  },
  "xAxis": {
    "type": "value",
    "name": "电影数量"
  },
  "yAxis": {
    "type": "category",
    "data": [
      "Game-Show",
      "Talk-Show",
      "Reality-TV",
      "News",
      "Western",
      "Adult",
      "War",
      "Musical",
      "Sport",
      "Animation",
      "Music",
      "History",
      "Fantasy",
      "Sci-Fi",
      "Mystery",
      "Family",
      "Biography",
      "Adventure",
      "Crime",
      "Romance",
      "Horror",
      "Action",
      "Thriller",
      "Comedy",
      "Documentary",
      "Drama"
    ],
    "inverse": false
  },
  "series": [
    {
      "type": "bar",
      "data": [
        13,
        200,
        552,
        1416,
        1774,
        2870,
        4137,
        4537,
        6838,
        8608,
        10887,
        11244,
        11455,
        11732,
        12351,
        12439,
        14901,
        17435,
        20850,
        26039,
        35146,
        36731,
        38600,
        66885,
        113966,
        154043
      ],
      "itemStyle": {
        "color": "#5470c6"
      },
      "name": "电影数量"
    }
  ],
  "visualMap": {
    "show": false,
    "min": 0,
    "max": 160000,
    "inRange": {
      "color": [
        "#a0d2f0",
        "#5470c6"
      ]
    }
  }
};
  var chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
  chart.setOption(option);
  window.addEventListener('resize', function(){ chart.resize(); });
})();
</script>
</body>
</html>
