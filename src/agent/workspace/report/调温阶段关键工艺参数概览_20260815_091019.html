<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
<script>
// CDN 兜底：主源加载失败时回退到备用源
if (typeof echarts === 'undefined') {
  document.write('<script src="https://unpkg.com/echarts@6.0.0/dist/echarts.min.js"><\/script>');
}
</script>
</head>
<body style="margin:0;padding:0;background:#fff;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
<div id="chart" style="width:100vw;height:100vh;"></div>
<script>
(function() {
  var option = {
  "radar": {
    "indicator": [
      {
        "name": "主加电流 (A)",
        "max": 2150
      },
      {
        "name": "主室炉压 (Torr)",
        "max": 2150
      },
      {
        "name": "坩埚位置 (mm)",
        "max": 2150
      },
      {
        "name": "总投料量 (kg)",
        "max": 2150
      },
      {
        "name": "液面高温计 (℃)",
        "max": 2150
      },
      {
        "name": "熔接亮度",
        "max": 2150
      },
      {
        "name": "籽晶位置 (mm)",
        "max": 2150
      }
    ],
    "radius": "60%",
    "splitNumber": 4,
    "axisName": {
      "formatter": "{value}",
      "color": "#666"
    },
    "splitArea": {
      "areaStyle": {
        "color": [
          "rgba(250, 250, 250, 0.3)",
          "rgba(200, 200, 200, 0.3)"
        ]
      }
    }
  },
  "series": [
    {
      "data": [
        {
          "value": [
            1786,
            10,
            87.1,
            919.75,
            1150,
            60.3,
            205.4
          ],
          "name": "调温阶段关键工艺参数概览"
        }
      ],
      "type": "radar"
    }
  ],
  "title": {
    "left": "center",
    "text": "调温阶段关键工艺参数概览",
    "top": "5%"
  },
  "tooltip": {
    "trigger": "item"
  }
};
  var chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
  chart.setOption(option);
  window.addEventListener('resize', function(){ chart.resize(); });
})();
</script>
</body>
</html>
