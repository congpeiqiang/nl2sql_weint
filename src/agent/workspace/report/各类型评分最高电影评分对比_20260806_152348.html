<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
<script>
// CDN 兜底：主源加载失败时回退到备用源
if (typeof echarts === 'undefined') {
  document.write('<script src="https://unpkg.com/echarts@6.0.0/dist/echarts.min.js"><\/script>');
}
</script>
</head>
<body style="margin:0;padding:0;background:#fff;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
<div id="chart" style="width:100vw;height:100vh;"></div>
<script>
(function() {
  var option = {
  "backgroundColor": "#fff",
  "title": {
    "text": "各类型评分最高电影评分对比",
    "left": "center"
  },
  "tooltip": {
    "trigger": "axis",
    "axisPointer": {
      "type": "shadow"
    }
  },
  "grid": {
    "left": 180,
    "right": 50,
    "top": 60,
    "bottom": 50
  },
  "xAxis": {
    "type": "value",
    "name": "评分",
    "min": 7.5,
    "max": 9.2
  },
  "yAxis": {
    "type": "category",
    "data": [
      "Western",
      "War",
      "Thriller",
      "Sport",
      "Sci-Fi",
      "Romance",
      "News",
      "Mystery",
      "Musical",
      "Music",
      "Horror",
      "History",
      "Fantasy",
      "Family",
      "Drama",
      "Documentary",
      "Crime",
      "Comedy",
      "Biography",
      "Animation",
      "Adventure",
      "Action"
    ]
  },
  "series": [
    {
      "name": "最高评分",
      "type": "bar",
      "data": [
        8.5,
        8.6,
        8.8,
        8.5,
        8.8,
        8.8,
        8,
        8.4,
        8.8,
        8.6,
        8.2,
        8.8,
        8.7,
        8.7,
        9,
        8.9,
        9,
        8.7,
        9,
        9,
        9,
        9
      ],
      "label": {
        "show": true,
        "position": "right"
      },
      "itemStyle": {
        "color": "#5470c6"
      }
    }
  ]
};
  var chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
  chart.setOption(option);
  window.addEventListener('resize', function(){ chart.resize(); });
})();
</script>
</body>
</html>
