<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
<script>
// CDN 兜底：主源加载失败时回退到备用源
if (typeof echarts === 'undefined') {
  document.write('<script src="https://unpkg.com/echarts@6.0.0/dist/echarts.min.js"><\/script>');
}
</script>
</head>
<body style="margin:0;padding:0;background:#fff;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
<div id="chart" style="width:100vw;height:100vh;"></div>
<script>
(function() {
  var option = {
  "backgroundColor": "#fff",
  "title": {
    "text": "片长最长的 Top 10 电影",
    "left": "center"
  },
  "tooltip": {
    "trigger": "axis",
    "axisPointer": {
      "type": "shadow"
    }
  },
  "grid": {
    "left": 320,
    "right": 80,
    "top": 60,
    "bottom": 50
  },
  "xAxis": {
    "type": "value",
    "name": "片长（分钟）"
  },
  "yAxis": {
    "type": "category",
    "data": [
      "Singularity",
      "Empired",
      "Psychos DFLLL",
      "Tendrils",
      "La Flor",
      "Appalachian Jetsam",
      "Tom and Jerry the Golden Era Anthology",
      "Crude Oil",
      "Saving Julian",
      "exergue - on documenta 14"
    ]
  },
  "series": [
    {
      "name": "片长（分钟）",
      "type": "bar",
      "data": [
        780,
        780,
        780,
        799,
        808,
        815,
        817,
        840,
        840,
        840
      ],
      "label": {
        "show": true,
        "position": "right"
      },
      "itemStyle": {
        "color": "#91cc75"
      }
    }
  ]
};
  var chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
  chart.setOption(option);
  window.addEventListener('resize', function(){ chart.resize(); });
})();
</script>
</body>
</html>
