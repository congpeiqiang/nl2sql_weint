<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
<script>
// CDN 兜底：主源加载失败时回退到备用源
if (typeof echarts === 'undefined') {
  document.write('<script src="https://unpkg.com/echarts@6.0.0/dist/echarts.min.js"><\/script>');
}
</script>
</head>
<body style="margin:0;padding:0;background:#fff;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
<div id="chart" style="width:100vw;height:100vh;"></div>
<script>
(function() {
  var option = {
  "backgroundColor": "#fff",
  "title": {
    "text": "IMDb 各类型电影数量分布（从多到少）",
    "left": "center",
    "top": "2%",
    "textStyle": {
      "fontSize": 16
    }
  },
  "tooltip": {
    "trigger": "axis",
    "axisPointer": {
      "type": "shadow"
    }
  },
  "grid": {
    "left": 130,
    "right": 60,
    "top": 50,
    "bottom": 40
  },
  "xAxis": {
    "type": "value",
    "name": "电影数量"
  },
  "yAxis": {
    "type": "category",
    "data": [
      "Game-Show",
      "Film-Noir",
      "Music",
      "Western",
      "Biography",
      "History",
      "Animation",
      "Sport",
      "Mystery",
      "Musical",
      "Fantasy",
      "Sci-Fi",
      "War",
      "Horror",
      "Crime",
      "Romance",
      "Family",
      "Adventure",
      "Thriller",
      "Action",
      "Drama",
      "Comedy",
      "Documentary",
      "Short"
    ],
    "axisLabel": {
      "fontSize": 11
    }
  },
  "series": [
    {
      "name": "电影数量",
      "type": "bar",
      "data": [
        1,
        2,
        2,
        2,
        3,
        3,
        4,
        4,
        5,
        6,
        7,
        7,
        9,
        13,
        14,
        15,
        16,
        19,
        26,
        30,
        103,
        115,
        222,
        585
      ],
      "itemStyle": {
        "color": {
          "type": "linear",
          "x": 0,
          "y": 0,
          "x2": 1,
          "y2": 0,
          "colorStops": [
            {
              "offset": 0,
              "color": "#5470c6"
            },
            {
              "offset": 1,
              "color": "#91cc75"
            }
          ]
        }
      },
      "label": {
        "show": true,
        "position": "right",
        "fontSize": 10
      }
    }
  ]
};
  var chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
  chart.setOption(option);
  window.addEventListener('resize', function(){ chart.resize(); });
})();
</script>
</body>
</html>
