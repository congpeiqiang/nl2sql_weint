<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
<script>
// CDN 兜底：主源加载失败时回退到备用源
if (typeof echarts === 'undefined') {
  document.write('<script src="https://unpkg.com/echarts@6.0.0/dist/echarts.min.js"><\/script>');
}
</script>
</head>
<body style="margin:0;padding:0;background:#fff;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
<div id="chart" style="width:100vw;height:100vh;"></div>
<script>
(function() {
  var option = {
  "backgroundColor": "#fff",
  "title": {
    "text": "Chinook_Aliyun 艺术家总数",
    "left": "center",
    "top": 10,
    "textStyle": {
      "fontSize": 18
    }
  },
  "tooltip": {
    "formatter": "{a} <br/>{b} : {c}"
  },
  "series": [
    {
      "name": "艺术家数量",
      "type": "gauge",
      "min": 0,
      "max": 300,
      "splitNumber": 6,
      "radius": "80%",
      "center": [
        "50%",
        "55%"
      ],
      "axisLine": {
        "lineStyle": {
          "color": [
            [
              0.7,
              "#5B8FF9"
            ],
            [
              0.917,
              "#91CC75"
            ],
            [
              1,
              "#F6BD16"
            ]
          ],
          "width": 18
        }
      },
      "pointer": {
        "length": "60%",
        "width": 5
      },
      "detail": {
        "fontSize": 34,
        "offsetCenter": [
          0,
          "70%"
        ],
        "formatter": "{value} 位"
      },
      "data": [
        {
          "value": 275,
          "name": "艺术家总数"
        }
      ],
      "title": {
        "offsetCenter": [
          0,
          "95%"
        ],
        "fontSize": 14
      },
      "axisLabel": {
        "distance": 20,
        "fontSize": 12
      }
    }
  ]
};
  var chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
  chart.setOption(option);
  window.addEventListener('resize', function(){ chart.resize(); });
})();
</script>
</body>
</html>
