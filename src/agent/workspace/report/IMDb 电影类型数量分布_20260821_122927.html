<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
<script>
// CDN 兜底：主源加载失败时回退到备用源
if (typeof echarts === 'undefined') {
  document.write('<script src="https://unpkg.com/echarts@6.0.0/dist/echarts.min.js"><\/script>');
}
</script>
</head>
<body style="margin:0;padding:0;background:#fff;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
<div id="chart" style="width:100vw;height:100vh;"></div>
<script>
(function() {
  var option = {
  "backgroundColor": "#fff",
  "title": {
    "text": "IMDb 电影类型数量分布",
    "left": "center",
    "top": "2%",
    "textStyle": {
      "fontSize": 18
    }
  },
  "tooltip": {
    "trigger": "axis",
    "axisPointer": {
      "type": "shadow"
    }
  },
  "grid": {
    "left": 140,
    "right": 60,
    "top": 60,
    "bottom": 30
  },
  "xAxis": {
    "type": "value",
    "name": "电影数量"
  },
  "yAxis": {
    "type": "category",
    "data": [
      "game-show",
      "talk-show",
      "reality-tv",
      "news",
      "western",
      "adult",
      "war",
      "musical",
      "sport",
      "animation",
      "music",
      "history",
      "fantasy",
      "sci-fi",
      "mystery",
      "family",
      "biography",
      "adventure",
      "crime",
      "romance",
      "horror",
      "action",
      "thriller",
      "comedy",
      "documentary",
      "drama"
    ],
    "inverse": true,
    "axisLabel": {
      "fontSize": 11
    }
  },
  "series": [
    {
      "name": "电影数量",
      "type": "bar",
      "data": [
        13,
        200,
        552,
        1416,
        1774,
        2870,
        4137,
        4537,
        6838,
        8608,
        10887,
        11244,
        11455,
        11732,
        12351,
        12439,
        14901,
        17435,
        20850,
        26039,
        35146,
        36731,
        38600,
        66885,
        113966,
        154043
      ],
      "itemStyle": {
        "color": {
          "type": "linear",
          "x": 0,
          "y": 0,
          "x2": 1,
          "y2": 0,
          "colorStops": [
            {
              "offset": 0,
              "color": "#5470c6"
            },
            {
              "offset": 1,
              "color": "#91cc75"
            }
          ]
        }
      },
      "label": {
        "show": true,
        "position": "right",
        "fontSize": 10
      }
    }
  ]
};
  var chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
  chart.setOption(option);
  window.addEventListener('resize', function(){ chart.resize(); });
})();
</script>
</body>
</html>
