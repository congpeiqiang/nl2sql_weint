<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
<script>
// CDN 兜底：主源加载失败时回退到备用源
if (typeof echarts === 'undefined') {
  document.write('<script src="https://unpkg.com/echarts@6.0.0/dist/echarts.min.js"><\/script>');
}
</script>
</head>
<body style="margin:0;padding:0;background:#fff;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
<div id="chart" style="width:100vw;height:100vh;"></div>
<script>
(function() {
  var option = {
  "backgroundColor": "#fff",
  "title": {
    "text": "合作≥3次且平均评分≥7.5的导演-演员组合",
    "subtext": "柱状=合作次数 | 折线=合作电影平均评分",
    "left": "center",
    "top": "2%"
  },
  "tooltip": {
    "trigger": "axis",
    "axisPointer": {
      "type": "shadow"
    }
  },
  "legend": {
    "data": [
      "合作次数",
      "平均评分"
    ],
    "top": "10%"
  },
  "grid": {
    "left": 420,
    "right": 60,
    "top": 90,
    "bottom": 50
  },
  "xAxis": {
    "type": "value",
    "name": "次数 / 评分"
  },
  "yAxis": {
    "type": "category",
    "inverse": true,
    "data": [
      "Jon Watts × Tom Holland",
      "Haruo Sotozaki × Hiro Shimono",
      "Haruo Sotozaki × Akari Kitô",
      "Rajkumar Hirani × Aamir Khan",
      "Shoaib Mansoor × Iman Ali",
      "Anurag Kashyap × Mahie Gill",
      "Dibakar Banerjee × Paresh Rawal",
      "Phil Lord × Will Ferrell",
      "Christopher Miller × Will Ferrell",
      "Chris Renaud × Pierre Coffin",
      "Felix van Groeningen × Johan Heldenbergh",
      "Wilson Yip × Donnie Yen"
    ]
  },
  "series": [
    {
      "name": "合作次数",
      "type": "bar",
      "data": [
        4,
        3,
        3,
        3,
        3,
        3,
        3,
        3,
        3,
        3,
        3,
        3
      ],
      "barWidth": 14,
      "itemStyle": {
        "color": "#5470c6"
      },
      "label": {
        "show": true,
        "position": "right"
      }
    },
    {
      "name": "平均评分",
      "type": "line",
      "data": [
        7.75,
        8.43,
        8.43,
        8.3,
        8.27,
        7.93,
        7.7,
        7.7,
        7.7,
        7.6,
        7.57,
        7.5
      ],
      "symbol": "circle",
      "symbolSize": 8,
      "lineStyle": {
        "color": "#d4a017",
        "width": 3
      },
      "itemStyle": {
        "color": "#d4a017"
      },
      "label": {
        "show": true,
        "position": "right",
        "formatter": "{c}"
      }
    }
  ]
};
  var chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
  chart.setOption(option);
  window.addEventListener('resize', function(){ chart.resize(); });
})();
</script>
</body>
</html>
