<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
<script>
// CDN 兜底：主源加载失败时回退到备用源
if (typeof echarts === 'undefined') {
  document.write('<script src="https://unpkg.com/echarts@6.0.0/dist/echarts.min.js"><\/script>');
}
</script>
</head>
<body style="margin:0;padding:0;background:#fff;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
<div id="chart" style="width:100vw;height:100vh;"></div>
<script>
(function() {
  var option = {
  "backgroundColor": "#fff",
  "title": {
    "text": "导演-演员黄金搭档 Top 12（合作≥3次，平均评分≥7.5）",
    "left": "center",
    "top": "2%",
    "textStyle": {
      "fontSize": 16
    }
  },
  "tooltip": {
    "trigger": "axis",
    "axisPointer": {
      "type": "shadow"
    },
    "formatter": "function(params){var p=params[0];var d=p.data;return '<b>'+d.name+'</b><br/>平均评分: '+d.value+'<br/>合作次数: '+d.coop+' 次<br/>代表作品: '+d.works;}"
  },
  "legend": {
    "data": [
      "平均评分"
    ],
    "top": "8%"
  },
  "grid": {
    "left": 260,
    "right": 60,
    "top": 80,
    "bottom": 50
  },
  "xAxis": {
    "type": "value",
    "name": "平均评分",
    "min": 7,
    "max": 9,
    "axisLabel": {
      "formatter": "{value}"
    }
  },
  "yAxis": {
    "type": "category",
    "data": [
      "Wilson Yip × Donnie Yen",
      "Felix van Groeningen × Johan Heldenbergh",
      "Chris Renaud × Pierre Coffin",
      "Dibakar Banerjee × Paresh Rawal",
      "Christopher Miller × Will Ferrell",
      "Phil Lord × Will Ferrell",
      "Anurag Kashyap × Mahie Gill",
      "Shoaib Mansoor × Iman Ali",
      "Rajkumar Hirani × Aamir Khan",
      "Haruo Sotozaki × Akari Kitô",
      "Haruo Sotozaki × Hiro Shimono",
      "Jon Watts × Tom Holland"
    ],
    "axisLabel": {
      "fontSize": 11
    }
  },
  "series": [
    {
      "name": "平均评分",
      "type": "bar",
      "data": [
        {
          "value": 7.5,
          "name": "Wilson Yip × Donnie Yen",
          "coop": 3,
          "works": "叶问系列"
        },
        {
          "value": 7.57,
          "name": "Felix van Groeningen × Johan Heldenbergh",
          "coop": 3,
          "works": "The Misfortunates"
        },
        {
          "value": 7.6,
          "name": "Chris Renaud × Pierre Coffin",
          "coop": 3,
          "works": "Despicable Me"
        },
        {
          "value": 7.7,
          "name": "Dibakar Banerjee × Paresh Rawal",
          "coop": 3,
          "works": "Oye Lucky!"
        },
        {
          "value": 7.7,
          "name": "Christopher Miller × Will Ferrell",
          "coop": 3,
          "works": "The Lego Movie"
        },
        {
          "value": 7.7,
          "name": "Phil Lord × Will Ferrell",
          "coop": 3,
          "works": "The Lego Movie"
        },
        {
          "value": 7.93,
          "name": "Anurag Kashyap × Mahie Gill",
          "coop": 3,
          "works": "Dev.D"
        },
        {
          "value": 8.27,
          "name": "Shoaib Mansoor × Iman Ali",
          "coop": 3,
          "works": "In the Name of God"
        },
        {
          "value": 8.3,
          "name": "Rajkumar Hirani × Aamir Khan",
          "coop": 3,
          "works": "三傻大闹宝莱坞"
        },
        {
          "value": 8.43,
          "name": "Haruo Sotozaki × Akari Kitô",
          "coop": 3,
          "works": "鬼灭之刃系列"
        },
        {
          "value": 8.43,
          "name": "Haruo Sotozaki × Hiro Shimono",
          "coop": 3,
          "works": "鬼灭之刃系列"
        },
        {
          "value": 7.75,
          "name": "Jon Watts × Tom Holland",
          "coop": 4,
          "works": "Spider-Man系列"
        }
      ],
      "itemStyle": {
        "color": "function(params){var v=params.value;if(v>=8.3)return '#c0392b';if(v>=8.0)return '#e67e22';if(v>=7.7)return '#f1c40f';return '#3498db';}"
      },
      "label": {
        "show": true,
        "position": "right",
        "formatter": "{c}",
        "fontSize": 11
      },
      "barWidth": 22
    }
  ]
};
  var chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
  chart.setOption(option);
  window.addEventListener('resize', function(){ chart.resize(); });
})();
</script>
</body>
</html>
