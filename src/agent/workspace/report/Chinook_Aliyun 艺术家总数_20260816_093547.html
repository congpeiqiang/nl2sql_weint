<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
<script>
// CDN 兜底：主源加载失败时回退到备用源
if (typeof echarts === 'undefined') {
  document.write('<script src="https://unpkg.com/echarts@6.0.0/dist/echarts.min.js"><\/script>');
}
</script>
</head>
<body style="margin:0;padding:0;background:#fff;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
<div id="chart" style="width:100vw;height:100vh;"></div>
<script>
(function() {
  var option = {
  "backgroundColor": "#fff",
  "title": {
    "text": "Chinook_Aliyun 艺术家总数",
    "left": "center",
    "top": "2%"
  },
  "tooltip": {
    "formatter": "{b}: {c} 位"
  },
  "series": [
    {
      "name": "艺术家数量",
      "type": "gauge",
      "min": 0,
      "max": 300,
      "progress": {
        "show": true,
        "width": 18
      },
      "axisLine": {
        "lineStyle": {
          "width": 18
        }
      },
      "axisTick": {
        "distance": -30,
        "length": 8,
        "lineStyle": {
          "color": "#999",
          "width": 2
        }
      },
      "splitLine": {
        "distance": -30,
        "length": 30,
        "lineStyle": {
          "color": "#999",
          "width": 4
        }
      },
      "axisLabel": {
        "distance": 20,
        "color": "#999",
        "fontSize": 12
      },
      "pointer": {
        "width": 5
      },
      "detail": {
        "valueAnimation": true,
        "formatter": "{value} 位",
        "color": "#5470c6",
        "fontSize": 24,
        "offsetCenter": [
          0,
          "70%"
        ]
      },
      "data": [
        {
          "value": 275,
          "name": "艺术家总数"
        }
      ]
    }
  ]
};
  var chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
  chart.setOption(option);
  window.addEventListener('resize', function(){ chart.resize(); });
})();
</script>
</body>
</html>
