<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
<script>
// CDN 兜底：主源加载失败时回退到备用源
if (typeof echarts === 'undefined') {
  document.write('<script src="https://unpkg.com/echarts@6.0.0/dist/echarts.min.js"><\/script>');
}
</script>
</head>
<body style="margin:0;padding:0;background:#fff;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
<div id="chart" style="width:100vw;height:100vh;"></div>
<script>
(function() {
  var option = {
  "backgroundColor": "#fff",
  "title": {
    "text": "IMDb 评分最高的5部电影",
    "subtext": "筛选条件：投票数 > 50,000",
    "left": "center",
    "top": "2%"
  },
  "tooltip": {
    "trigger": "axis",
    "axisPointer": {
      "type": "shadow"
    }
  },
  "grid": {
    "left": 280,
    "right": 60,
    "top": 80,
    "bottom": 50
  },
  "xAxis": {
    "type": "value",
    "name": "评分",
    "min": 8.4,
    "max": 9.2
  },
  "yAxis": {
    "type": "category",
    "data": [
      "20 Days in Mariupol",
      "Rocketry: The Nambi Effect",
      "12th Fail",
      "Inception",
      "Punjab '95"
    ]
  },
  "series": [
    {
      "name": "评分",
      "type": "bar",
      "data": [
        {
          "value": 8.6,
          "itemStyle": {
            "color": "#5470c6"
          }
        },
        {
          "value": 8.6,
          "itemStyle": {
            "color": "#5470c6"
          }
        },
        {
          "value": 8.7,
          "itemStyle": {
            "color": "#91cc75"
          }
        },
        {
          "value": 8.8,
          "itemStyle": {
            "color": "#fac858"
          }
        },
        {
          "value": 9,
          "itemStyle": {
            "color": "#ee6666"
          }
        }
      ],
      "barWidth": "50%",
      "label": {
        "show": true,
        "position": "right",
        "fontSize": 14,
        "fontWeight": "bold"
      }
    }
  ]
};
  var chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
  chart.setOption(option);
  window.addEventListener('resize', function(){ chart.resize(); });
})();
</script>
</body>
</html>
