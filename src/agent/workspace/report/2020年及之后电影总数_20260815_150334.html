<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
<script>
// CDN 兜底：主源加载失败时回退到备用源
if (typeof echarts === 'undefined') {
  document.write('<script src="https://unpkg.com/echarts@6.0.0/dist/echarts.min.js"><\/script>');
}
</script>
</head>
<body style="margin:0;padding:0;background:#fff;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
<div id="chart" style="width:100vw;height:100vh;"></div>
<script>
(function() {
  var option = {
  "series": [
    {
      "name": "2020年及之后电影总数",
      "type": "gauge",
      "data": [
        {
          "name": "2020年及之后电影总数",
          "value": 130469
        }
      ],
      "center": [
        "50%",
        "55%"
      ],
      "radius": "80%",
      "min": 0,
      "max": 200000,
      "startAngle": 180,
      "endAngle": 0,
      "axisLine": {
        "lineStyle": {
          "width": 6,
          "color": [
            [
              0.3,
              "#67e0e3"
            ],
            [
              0.7,
              "#37a2da"
            ],
            [
              1,
              "#fd666d"
            ]
          ]
        }
      },
      "pointer": {
        "itemStyle": {
          "color": "inherit"
        }
      },
      "axisTick": {
        "distance": -30,
        "length": 8,
        "lineStyle": {
          "color": "#fff",
          "width": 2
        }
      },
      "splitLine": {
        "distance": -30,
        "length": 30,
        "lineStyle": {
          "color": "#fff",
          "width": 4
        }
      },
      "axisLabel": {
        "color": "inherit",
        "distance": 40,
        "fontSize": 12
      },
      "detail": {
        "valueAnimation": true,
        "formatter": "{value}",
        "color": "inherit",
        "fontSize": 20,
        "offsetCenter": [
          0,
          "30%"
        ]
      },
      "title": {
        "offsetCenter": [
          0,
          "50%"
        ],
        "fontSize": 14
      }
    }
  ],
  "title": {
    "left": "center",
    "text": "2020年及之后电影总数"
  }
};
  var chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
  chart.setOption(option);
  window.addEventListener('resize', function(){ chart.resize(); });
})();
</script>
</body>
</html>
