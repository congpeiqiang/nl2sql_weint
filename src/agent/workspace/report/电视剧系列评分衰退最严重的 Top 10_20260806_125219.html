<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
<script>
// CDN 兜底：主源加载失败时回退到备用源
if (typeof echarts === 'undefined') {
  document.write('<script src="https://unpkg.com/echarts@6.0.0/dist/echarts.min.js"><\/script>');
}
</script>
</head>
<body style="margin:0;padding:0;background:#fff;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
<div id="chart" style="width:100vw;height:100vh;"></div>
<script>
(function() {
  var option = {
  "backgroundColor": "#fff",
  "title": {
    "text": "电视剧系列评分衰退最严重的 Top 10",
    "left": "center",
    "top": "2%"
  },
  "tooltip": {
    "trigger": "axis",
    "axisPointer": {
      "type": "shadow"
    },
    "formatter": "{b}<br/>衰退率: {c}%"
  },
  "legend": {
    "data": [
      "衰退率(%)"
    ],
    "top": "8%"
  },
  "grid": {
    "left": 260,
    "right": 60,
    "top": "15%",
    "bottom": 50
  },
  "xAxis": {
    "type": "value",
    "name": "衰退率(%)",
    "axisLabel": {
      "formatter": "{value}%"
    }
  },
  "yAxis": {
    "type": "category",
    "data": [
      "One Punch Man",
      "Piers Morgan Uncensored",
      "Rainbow High",
      "The Queen of Flow",
      "Slendybob",
      "Nicht nachmachen!",
      "The Beach Hotel",
      "Royal Histories",
      "CritiCar",
      "The Drew Barrymore Show"
    ],
    "axisLabel": {
      "fontSize": 12
    }
  },
  "series": [
    {
      "name": "衰退率(%)",
      "type": "bar",
      "data": [
        54.76,
        55.14,
        56.56,
        59.16,
        59.41,
        61.64,
        62.81,
        64.34,
        66.09,
        67.27
      ],
      "itemStyle": {
        "color": "#ee6666"
      },
      "label": {
        "show": true,
        "position": "right",
        "formatter": "{c}%",
        "fontWeight": "bold"
      }
    }
  ]
};
  var chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
  chart.setOption(option);
  window.addEventListener('resize', function(){ chart.resize(); });
})();
</script>
</body>
</html>
