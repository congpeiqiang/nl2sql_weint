<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
<script>
// CDN 兜底：主源加载失败时回退到备用源
if (typeof echarts === 'undefined') {
  document.write('<script src="https://unpkg.com/echarts@6.0.0/dist/echarts.min.js"><\/script>');
}
</script>
</head>
<body style="margin:0;padding:0;background:#fff;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
<div id="chart" style="width:100vw;height:100vh;"></div>
<script>
(function() {
  var option = {
  "backgroundColor": "#fff",
  "title": {
    "text": "IMDb 高分电影 Top 20（评分 ≥ 8.0）",
    "left": "center",
    "top": 10,
    "textStyle": {
      "fontSize": 18
    }
  },
  "tooltip": {
    "trigger": "axis",
    "axisPointer": {
      "type": "shadow"
    }
  },
  "grid": {
    "left": 430,
    "right": 60,
    "top": 60,
    "bottom": 60
  },
  "xAxis": {
    "type": "value",
    "name": "评分",
    "min": 8.4,
    "max": 9.1
  },
  "yAxis": {
    "type": "category",
    "data": [
      "Toma",
      "Pariyerum Perumal",
      "Rocketry: The Nambi Effect",
      "20 Days in Mariupol",
      "Soorarai Pottru",
      "Jai Bhim",
      "Kadaisi Vivasayi",
      "Solo Leveling: ReAwakening",
      "Demon Slayer: Kimetsu no Yaiba - Mt. Natagumo Arc",
      "Resurrection",
      "#Home",
      "777 Charlie",
      "12th Fail",
      "The Silence of Swastika",
      "The Phantom of the Opera at the Royal Albert Hall",
      "C/o Kancharapalem",
      "Inception",
      "David Attenborough: A Life on Our Planet",
      "Attack on Titan: The Last Attack",
      "Punjab '95"
    ]
  },
  "series": [
    {
      "name": "评分",
      "type": "bar",
      "data": [
        8.6,
        8.6,
        8.6,
        8.6,
        8.6,
        8.6,
        8.7,
        8.7,
        8.7,
        8.7,
        8.7,
        8.7,
        8.7,
        8.8,
        8.8,
        8.8,
        8.8,
        8.9,
        9,
        9
      ],
      "label": {
        "show": true,
        "position": "right",
        "formatter": "{c}"
      },
      "itemStyle": {
        "color": "#f39c12",
        "borderRadius": [
          0,
          4,
          4,
          0
        ]
      },
      "barMaxWidth": 26
    }
  ]
};
  var chart = echarts.init(document.getElementById('chart'), null, {renderer: 'canvas'});
  chart.setOption(option);
  window.addEventListener('resize', function(){ chart.resize(); });
})();
</script>
</body>
</html>
