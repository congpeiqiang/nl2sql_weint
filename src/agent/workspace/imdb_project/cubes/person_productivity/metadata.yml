# 人物生产力分析立方体
# 支持按职业、出生年代、健在状态等维度分析从业者产出
name: person_productivity
description: "影视从业者生产力分析立方体"

base_object: names

joins:
  - name: principals
    sql: "names.id = principals.name_id"
  - name: titles
    sql: "principals.title_id = titles.id"
  - name: names_primaryprofessions
    sql: "names.id = names_primaryprofessions.name_id"
  - name: professions
    sql: "names_primaryprofessions.profession_id = professions.id"

measures:
  - name: total_titles
    sql: "COUNT(DISTINCT principals.title_id)"
    expression: "COUNT(DISTINCT principals.title_id)"
    type: count
    description: "参与作品总数"

  - name: role_diversity
    sql: "COUNT(DISTINCT principals.category_id)"
    expression: "COUNT(DISTINCT principals.category_id)"
    type: count
    description: "角色类型多样性（担任过多少种不同职位）"

  - name: career_span
    sql: "MAX(titles.start_year) - MIN(titles.start_year)"
    expression: "MAX(titles.start_year) - MIN(titles.start_year)"
    type: number
    description: "职业生涯跨度（年）"

  - name: avg_work_rating
    sql: "AVG(titles.average_rating)"
    expression: "AVG(titles.average_rating)"
    type: avg
    description: "参与作品的平均评分"

  - name: productivity_density
    sql: "COUNT(DISTINCT principals.title_id) * 1.0 / NULLIF(MAX(titles.start_year) - MIN(titles.start_year) + 1, 0)"
    expression: "COUNT(DISTINCT principals.title_id) * 1.0 / NULLIF(MAX(titles.start_year) - MIN(titles.start_year) + 1, 0)"
    type: number
    description: "生产力密度（年均产出作品数）"

  - name: total_votes_received
    sql: "SUM(titles.num_votes)"
    expression: "SUM(titles.num_votes)"
    type: sum
    description: "参与作品的总投票数"

  - name: director_title_count
    sql: "COUNT(DISTINCT CASE WHEN principals.category_id = 'director' THEN principals.title_id END)"
    expression: "COUNT(DISTINCT CASE WHEN principals.category_id = 'director' THEN principals.title_id END)"
    type: count
    description: "导演作品数"

  - name: actor_title_count
    sql: "COUNT(DISTINCT CASE WHEN principals.category_id IN ('actor', 'actress') THEN principals.title_id END)"
    expression: "COUNT(DISTINCT CASE WHEN principals.category_id IN ('actor', 'actress') THEN principals.title_id END)"
    type: count
    description: "演员作品数"

dimensions:
  - name: profession
    sql: "professions.display_name"
    expression: "professions.display_name"
    type: string
    description: "主要职业（从 names_primaryprofessions 关联）"

  - name: is_alive
    sql: "CASE WHEN names.death_year IS NULL THEN '健在' ELSE '已故' END"
    expression: "CASE WHEN names.death_year IS NULL THEN '健在' ELSE '已故' END"
    type: string
    description: "是否健在"

  - name: birth_decade
    sql: "FLOOR(names.birth_year / 10) * 10"
    expression: "FLOOR(names.birth_year / 10) * 10"
    type: int
    description: "出生年代"

  - name: alive_status
    sql: "CASE WHEN names.death_year IS NULL THEN 'living' ELSE 'deceased' END"
    expression: "CASE WHEN names.death_year IS NULL THEN 'living' ELSE 'deceased' END"
    type: string

  - name: primary_role
    sql: "principals.category_id"
    expression: "principals.category_id"
    type: string
    description: "在作品中的角色类别"

  - name: is_multi_role
    sql: "CASE WHEN COUNT(DISTINCT principals.category_id) >= 2 THEN '多角色' ELSE '单一角色' END"
    expression: "CASE WHEN COUNT(DISTINCT principals.category_id) >= 2 THEN '多角色' ELSE '单一角色' END"
    type: string
    description: "是否多角色从业者"
