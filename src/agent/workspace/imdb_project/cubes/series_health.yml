# 电视剧系列健康度分析立方体
# 支持按季号、系列状态等维度分析剧集表现
name: series_health
description: "电视剧系列健康度分析立方体"

model: titles

joins:
  - name: episodes
    sql: "titles.id = episodes.parent_id"
  - name: episode_titles
    sql: "episodes.id = episode_titles.id"
    model: titles

measures:
  - name: total_seasons
    sql: "COUNT(DISTINCT episodes.season_number)"
    type: count
    description: "总季数"

  - name: total_episodes
    sql: "COUNT(DISTINCT episodes.id)"
    type: count
    description: "总集数"

  - name: avg_episode_rating
    sql: "AVG(episode_titles.average_rating)"
    type: avg
    description: "剧集平均评分"

  - name: episode_per_season
    sql: "COUNT(DISTINCT episodes.id) * 1.0 / NULLIF(COUNT(DISTINCT episodes.season_number), 0)"
    type: number
    description: "每季平均集数"

  - name: series_longevity
    sql: "MAX(episode_titles.start_year) - MIN(episode_titles.start_year)"
    type: number
    description: "播出跨度（年）"

  - name: rating_volatility
    sql: "STDDEV(episode_titles.average_rating)"
    type: number
    description: "评分波动性（标准差）"

  - name: best_season_avg
    sql: "MAX(AVG(episode_titles.average_rating))"
    type: number
    description: "最佳季平均评分"

  - name: worst_season_avg
    sql: "MIN(AVG(episode_titles.average_rating))"
    type: number
    description: "最差季平均评分"

dimensions:
  - name: series_status
    sql: "CASE WHEN titles.end_year IS NULL THEN '在播' ELSE '已完结' END"
    type: string
    description: "系列状态"

  - name: season_number
    sql: "episodes.season_number"
    type: int
    description: "季号"

  - name: series_decade
    sql: "FLOOR(titles.start_year / 10) * 10"
    type: int
    description: "系列开播年代"

  - name: longevity_tier
    sql: "CASE WHEN (MAX(episode_titles.start_year) - MIN(episode_titles.start_year)) >= 10 THEN '长寿(10年+)' WHEN (MAX(episode_titles.start_year) - MIN(episode_titles.start_year)) >= 5 THEN '中寿(5-10年)' ELSE '短寿(<5年)' END"
    type: string
    description: "寿命等级"
