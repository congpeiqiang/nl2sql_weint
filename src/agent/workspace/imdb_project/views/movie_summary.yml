# 电影综合摘要视图
# 聚合每部电影的核心指标：评分、类型、参与者统计
name: movie_summary
description: "电影综合摘要视图，每行一部电影，包含评分、类型、演职人员统计"

model: titles

joins:
  - name: titles_genres
    sql: "titles.id = titles_genres.title_id"
  - name: genres
    sql: "titles_genres.genre_id = genres.id"
  - name: principals
    sql: "titles.id = principals.title_id"
  - name: names
    sql: "principals.name_id = names.id"

dimensions:
  - name: id
    sql: "titles.id"
    type: string
  - name: primary_title
    sql: "titles.primary_title"
    type: string
  - name: start_year
    sql: "titles.start_year"
    type: int
  - name: runtime_minutes
    sql: "titles.runtime_minutes"
    type: int
  - name: average_rating
    sql: "titles.average_rating"
    type: double
  - name: num_votes
    sql: "titles.num_votes"
    type: int
  - name: genre
    sql: "genres.display_name"
    type: string

measures:
  - name: total_participants
    sql: "COUNT(DISTINCT principals.name_id)"
    type: count
  - name: cast_count
    sql: "COUNT(DISTINCT CASE WHEN principals.category_id IN ('actor', 'actress') THEN principals.name_id END)"
    type: count
  - name: director_count
    sql: "COUNT(DISTINCT CASE WHEN principals.category_id = 'director' THEN principals.name_id END)"
    type: count

filters:
  - sql: "titles.title_type = 'movie'"
