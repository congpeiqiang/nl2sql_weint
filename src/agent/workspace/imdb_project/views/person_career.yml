# 人物职业生涯视图
# 聚合每个人的职业生涯指标：作品数、跨度、平均评分
name: person_career
description: "人物职业生涯聚合视图，每行一个人物，包含产出量、跨度、评分等指标"

model: names

joins:
  - name: principals
    sql: "names.id = principals.name_id"
  - name: titles
    sql: "principals.title_id = titles.id"

dimensions:
  - name: person_id
    sql: "names.id"
    type: string
  - name: primary_name
    sql: "names.primary_name"
    type: string
  - name: birth_year
    sql: "names.birth_year"
    type: int
  - name: death_year
    sql: "names.death_year"
    type: int

measures:
  - name: total_titles
    sql: "COUNT(DISTINCT principals.title_id)"
    type: count
  - name: role_types
    sql: "COUNT(DISTINCT principals.category_id)"
    type: count
  - name: career_start
    sql: "MIN(titles.start_year)"
    type: number
  - name: career_end
    sql: "MAX(titles.start_year)"
    type: number
  - name: career_span_years
    sql: "MAX(titles.start_year) - MIN(titles.start_year)"
    type: number
  - name: avg_rating_of_works
    sql: "AVG(titles.average_rating)"
    type: avg
  - name: total_votes_received
    sql: "SUM(titles.num_votes)"
    type: sum

filters:
  - sql: "titles.start_year IS NOT NULL"
