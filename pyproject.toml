[project]
name = "nl2sql"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.2",
    "clickhouse-driver>=0.2.11",
    "deepagents>=0.6.12",
    "fastmcp>=3.4.4",
    "greenlet>=3.5.5",
    "langchain-deepseek>=1.1.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.3.5",
    "langfuse>=4.14.4",
    "langgraph-api>=0.11.1",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-checkpoint-postgres>=3.1.0",
    "matplotlib>=3.11.1",
    "mysqlclient>=2.2.8",
    "opensandbox>=0.1.14",
    "pandas>=3.0.3",
    "pymysql>=1.2.0",
    "pyyaml>=6.0.3",
    "vanna[mysql]>=2.0.2",
    "wrenai[clickhouse,memory,postgres]>=0.13.0",
]

# ⚠️ 任何 [tool.*] 表头都必须放在 dependencies 之后：TOML 里表头会改变其后所有键的归属，
#    写在 [project] 中间会把 dependencies 吞进 tool 表（2026-10-14 事故：3491a6a 把本块
#    插在 dependencies 之前 ⇒ [project] 零依赖 ⇒ uv sync 不装 langgraph-api ⇒ 镜像版本闸炸）。
[tool.pytest.ini_options]
testpaths = ["src/test"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring live services (deselect with '-m \"not integration\"')",
]
