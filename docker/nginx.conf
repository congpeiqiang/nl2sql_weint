events {
    worker_connections 1024;
}

http {
    # ── 上游解析：请求期查 Docker 内嵌 DNS（2026-10-05）──
    # 原来这里是 `upstream backend { server langgraph-api:2026; }`：nginx 在**启动期**
    # 解析一次并把 IP **永久**缓存。两个后果：
    #   ① 容器重建拿到新 IP ⇒ nginx 仍打旧 IP ⇒ **永久 502 直到 reload**（2026-10-05 那次
    #      发版没炸，只是因为 Docker 把同一个 IP 又分给了新容器 —— 靠运气）；
    #   ② 蓝绿/滚动发布（新容器必然新 IP）被这条路直接封死。
    # 改成 resolver + **变量形式**的 proxy_pass 后，nginx 在**请求期**查 DNS，`valid` 到期
    # 自动重查 ⇒ 换容器**不需要 reload**。附带好处：后端没起来时 nginx 也能正常启动
    # （旧写法下 `host not found in upstream` 会让 nginx 直接起不来）。
    # 127.0.0.11 = Docker 用户自定义网络的内嵌 DNS（compose 默认网络满足前提）；
    # `ipv6=off` 是必需的（Docker 内嵌 DNS 对 AAAA 处理不当，会报 could not be resolved）。
    # ⚠️ 代价：变量形式**不做启动期解析** ⇒ 主机名写错 `nginx -t` 也发现不了，只能靠请求期
    #    502 + error_log 暴露。改完必须真打一次请求验收（见 docs/prod环境/发布脚本.md §5）。
    #    `set $…_up` 写在 server 块里（见下），三个 location 共用。
    # ⚠️ `valid` 的缓存是**每个 worker 各自一份**；Docker 对服务名固定回 600s TTL，这里覆盖它。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;          # 默认 30s：DNS 挂掉时会把请求挂 30s 才 502

    # ── P2-2 请求级 ID + 访问日志 ──
    # nginx 为每个请求确定一枚 id → 透给后端（proxy_set_header X-Request-ID $rid）；
    # 后端把它写进自己的日志（src/api/request_log.py，那里还有毫秒耗时）并在响应头回显
    # ⇒「nginx 边缘日志 / 后端 agent-server.log / 用户看到的响应头」三处同一个 id。
    # $rid 的取值：**客户端自己带了就沿用**（前端以后若要生成 correlation id，nginx 不会
    # 抹掉它），否则用 nginx 生成的 $request_id（32 位 hex）。后端对入站 id 另有白名单
    # 净化（`^[A-Za-z0-9._:-]{1,64}$`），非法值会被丢弃重新生成 —— 日志伪造防线在后端。
    # 注意：官方 nginx 镜像里 access.log 是指向 stdout 的软链 → 这份日志进
    # `docker logs nl2sql-app_nginx_1`（**容器被 rm 即丢**，与后端的持久日志不同）。
    #
    # ⚠️ 本文件**不进发布包**（发布 tar 排除 docker/），必须手工应用到服务器：
    #    $AppDir/docker/nginx.conf（compose 把该文件 bind mount 到容器
    #    /etc/nginx/nginx.conf:ro）→ 属于"文件级挂载"，**必须就地改（cat > 同一个
    #    inode），不能用 mv 换文件**，否则容器仍读旧内容。改完
    #    `docker exec nl2sql-app_nginx_1 nginx -t && nginx -s reload`（reload 不动连接，
    #    不需要重建容器）。
    #    一键做法：`bash docs/prod环境/apply-nginx-request-id-patch.sh` —— 它做的是**整份
    #    文件同步**（md5 判差异 → 备份 → `cat >` 就地写同一 inode → `nginx -t`（失败自动
    #    回滚）→ reload），不只 P2-2 那几行；本文件的上游解析改动也走它。
    #    2026-10-05 核实：线上副本与本文件 **md5 逐字相同**（无分叉）——旧注里「线上还多
    #    一段 P0-3 注释」已过时，P0-3 那段本文件里本来就有。
    map $http_x_request_id $rid {
        default $http_x_request_id;
        ""      $request_id;
    }
    log_format nl2sql '$remote_addr - [$time_local] "$request" $status '
                      '$body_bytes_sent $request_time s rid=$rid ua="$http_user_agent"';
    access_log /var/log/nginx/access.log nl2sql;

    server {
        listen 80;
        server_name _;
        client_max_body_size 50m;

        # 上游地址：**变量形式** ⇒ 由上面的 resolver 在请求期解析。必须带端口
        # （只写 "langgraph-api" 会默认走 80）。`set` 在 server 级会被三个 location
        # 继承、每请求求值。
        set $backend_up  "langgraph-api:2026";
        set $frontend_up "frontend:3000";

        # 变量形式的 proxy_pass 下，`proxy_redirect` 的默认行为会被 nginx **静默关闭**；
        # 这里显式写出来，免得后人以为重写还开着（本仓后端从不返回绝对 Location，
        # 所以行为与改动前一致）。
        proxy_redirect off;

        # P2-2：把 id 回显给客户端 —— 用户报错时直接把这个值发过来即可定位。
        # nginx 自己加这一条，**不依赖后端版本**（后端 `RequestContextMiddleware` 是
        # "响应头里没有才补"，不会重复）；`always` 让 nginx 自己产生的错误响应
        # （502/504 等）也带 id，那类请求根本到不了后端。
        add_header X-Request-ID $rid always;

        # ── SSE / 流式响应支持（LangGraph /runs/stream、token streaming）──
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # ── 连接超时收紧（2026-10-05）──
        # 默认 60s。上游**端口已关**（容器已删）时内核立刻回 RST ⇒ 不花时间；但上游
        # **IP 已被收回**时（容器删了、IP 给了别人或没人）是 ARP 重试：**挂 ~40s 才失败**
        # ——2026-10-05 发版实测那两个瘦身后的 502 就是这么来的。
        # 收到 2s 的效果是**把「挂 40s」变成「2s 内快速 502」**（nginx 会重查 DNS 拿新 IP，
        # 见上面 resolver 的 valid=10s），并**降低上游故障被发现的时间**。
        # ⚠️ 它**不能消除**那类 502，只是把它变快：蓝绿切流时旧色**仍然活着**，
        #    所以那 ≤10s 的正面缓存窗口里请求仍打到旧色、照样成功 —— 真正消除要靠蓝绿。
        # 上游正常时 connect 是瞬时的，2s 有 20 倍余量，不会误伤。
        proxy_connect_timeout 2s;

        # P0-3：原 location /report/（alias /app/data/workspace/report/ + autoindex on）
        # 已删除 —— 它**绕过后端认证**，未登录即可列出并下载全站所有报告；
        # 且前端从未使用过它：报告预览/下载走 /api/reports/{name}
        # （前端把 /workspace/report/xxx.md 映射到该 API，见 src/api/report_file.py 模块注释）。

        # ── 自定义 API（custom_app.py 路由）→ 后端 ──
        location /api/ {
            proxy_pass http://$backend_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $rid;
        }

        # ── LangGraph 原生 API → 后端 ──
        location ~ ^/(threads|runs|assistants|store|ok|docs|openapi) {
            proxy_pass http://$backend_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $rid;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ── 其他请求 → 前端 ──
        location / {
            proxy_pass http://$frontend_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Request-ID $rid;
        }
    }
}
